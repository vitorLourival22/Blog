{% load static %}
{% block content %}
<title>Posted</title>
<link href="{% static 'css/post.css' %}" rel="stylesheet"/>
<body class="img" style="background-image: url('{% static 'assets/img/fundo.jpg'%}')">
</body>
<div class="log">
  <div class="item-log">
  <h1>Criar Publicação</h1>
    <form method="post">
    <label for="Posted">
        <input class="ps" type="text" name="po" id="posted" placeholder="   Descrição">
    </label>
    <br>
    <label for="imgpos">
        <div class="upload-wrapper">
            <br>
            <input type="file" id="file-upload" />
            <label for="file-upload" class="upload-button">Midia</label>
        </div>
    </label>
      {% csrf_token %}
      {{ form.non_field_errors }}
      <br>
      <a class="bt1" href="{% url 'signup' %}">Publicar</a>
    </form>
  </div>
</div>
{% endblock %}
