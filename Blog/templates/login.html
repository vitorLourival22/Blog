{% load static %}
{% block content %}
<title>Login</title>
<link href="{% static 'css/login.css' %}" rel="stylesheet"/>
<header>
  <p>Aries studios</p>
</header>
<body class="img" style="background-image: url('{% static 'assets/img/fundo.jpg'%}')">
</body>
<div class="log">
  <div class="item-log">
  <h1>LOGIN</h1>
    <form method="post">
      {% csrf_token %}
    {{ form.as_p }}
    <label for="email" class="email">
      <input type="email"  name="Email" placeholder="email" required>
    </label>
    <br>
    <br>
    <label for="password"><input type="password" name="password" placeholder="Senha" required>
    </label>
    <br>
    <br>
    <button class="btn" type="submit">Login</button>
    <br>
    <button class="btn-pass" type="submit">Esqueçeu sua senha?</button>
    <br>
    <a href="{% url 'signup' %}">Criar uma Conta</a>
  </form>
</div>
</div>
{% endblock %}
